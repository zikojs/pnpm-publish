name: 'PNPM Workspace Sync & Release'
description: Build and publish pnpm workspace packages to npm with automatic dist-tag detection and optional template synchronization.

branding:
  icon: package
  color: orange

inputs:
  tag-prefix:
    description: "Git tag prefix to strip to get the version (e.g. ziko-v)"
    required: false
    default: "v"

  dist-tag:
    description: "Explicit npm dist-tag. If empty, derived from the git tag."
    required: false
    default: ""

  default-dist-tag:
    description: "Fallback dist-tag when not on a tag push and dist-tag is empty"
    required: false
    default: "latest"

  packages-dir:
    description: "Directory containing the packages to publish"
    required: false
    default: "packages"

  build-filter:
    description: "pnpm --filter expression used for the build step"
    required: false
    default: "./packages/**"

  pnpm-version:
    description: "Fallback pnpm version when packageManager is not defined"
    required: false
    default: "12"

  npm-token:
    description: "npm auth token (omit if using trusted publishing)"
    required: false
    default: ""

  access:
    description: "npm access level (public/restricted). Empty = package default"
    required: false
    default: ""

  dry-run-only:
    description: "Only run the dry-run preview, do not publish"
    required: false
    default: "false"

  fail-on-build-error:
    description: "Fail if the build step fails"
    required: false
    default: "true"

  sync-templates:
    description: "Temporarily replace workspace/catalog dependencies with npm versions"
    required: false
    default: "false"

  template-patterns:
    description: "Template directories relative to the repository root"
    required: false
    default: "packages/*/templates/*"

  template-sync-mode:
    description: "Template synchronization mode: unchecked or wait"
    required: false
    default: "unchecked"

  dependency-filter:
    description: "pnpm filter selecting packages to publish before template synchronization in wait mode"
    required: false
    default: ""

  publish-timeout:
    description: "Maximum seconds to wait for package versions to appear on npm"
    required: false
    default: "300"

  publish-interval:
    description: "Seconds between npm publication checks"
    required: false
    default: "10"

outputs:
  dist-tag:
    description: "The npm dist-tag that was used"
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Detect pnpm version
      id: pnpm
      shell: bash
      env:
        FALLBACK_VERSION: ${{ inputs.pnpm-version }}
      run: |
        set -euo pipefail

        VERSION=$(node --input-type=commonjs -e "
          const pkg = require('./package.json');
          const manager = pkg.packageManager || '';
          const match = manager.match(/^pnpm@(.+)$/);
          console.log(match ? match[1] : process.env.FALLBACK_VERSION);
        ")

        if [[ -z "$VERSION" ]]; then
          echo "::error::Could not determine pnpm version"
          exit 1
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Using pnpm $VERSION"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm.outputs.version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        registry-url: https://registry.npmjs.org

    - name: Validate template sync configuration
      if: ${{ inputs.sync-templates == 'true' }}
      shell: bash
      env:
        MODE: ${{ inputs.template-sync-mode }}
        DEPENDENCY_FILTER: ${{ inputs.dependency-filter }}
      run: |
        set -euo pipefail

        if [[ "$MODE" != "unchecked" && "$MODE" != "wait" ]]; then
          echo "::error::template-sync-mode must be 'unchecked' or 'wait'"
          exit 1
        fi

        if [[ "$MODE" == "wait" && -z "$DEPENDENCY_FILTER" ]]; then
          echo "::error::dependency-filter is required when template-sync-mode is 'wait'"
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Determine npm dist-tag
      id: release
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_TAG: ${{ inputs.dist-tag }}
        DEFAULT_TAG: ${{ inputs.default-dist-tag }}
      run: |
        set -euo pipefail

        if [[ -n "$INPUT_TAG" ]]; then
          TAG="$INPUT_TAG"

        elif [[ "$REF_TYPE" == "tag" ]]; then
          VERSION="${REF_NAME#"$TAG_PREFIX"}"

          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            TAG="${PRE%%.*}"

            if [[ ! "$TAG" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then
              TAG="beta"
            fi
          else
            TAG="latest"
          fi

        else
          TAG="$DEFAULT_TAG"
        fi

        if [[ ! "$TAG" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
          echo "::error::Invalid npm dist-tag: $TAG"
          exit 1
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Publishing with npm dist-tag: $TAG"

    - name: Build packages
      shell: bash
      env:
        FILTER: ${{ inputs.build-filter }}
        FAIL: ${{ inputs.fail-on-build-error }}
      run: |
        set -euo pipefail

        if pnpm --filter "$FILTER" -r --if-present run build; then
          exit 0
        fi

        if [[ "$FAIL" == "true" ]]; then
          echo "::error::Build failed"
          exit 1
        fi

        echo "::warning::Build failed, continuing"

    # In wait mode, publish selected dependencies before preparing templates.
    - name: Publish template dependencies
      if: ${{ inputs.sync-templates == 'true' && inputs.template-sync-mode == 'wait' && inputs.dry-run-only != 'true' }}
      shell: bash
      env:
        DEPENDENCY_FILTER: ${{ inputs.dependency-filter }}
        NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
        NPM_ACCESS: ${{ inputs.access }}
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: |
        set -euo pipefail

        ARGS=(-r --tag "$NPM_DIST_TAG" --no-git-checks)

        if [[ -n "$NPM_ACCESS" ]]; then
          ARGS+=(--access "$NPM_ACCESS")
        fi

        echo "Publishing dependency packages selected by: $DEPENDENCY_FILTER"

        pnpm --filter "$DEPENDENCY_FILTER" publish "${ARGS[@]}"

    - name: Wait for template dependencies
      if: ${{ inputs.sync-templates == 'true' && inputs.template-sync-mode == 'wait' && inputs.dry-run-only != 'true' }}
      shell: bash
      env:
        DEPENDENCY_FILTER: ${{ inputs.dependency-filter }}
        PUBLISH_TIMEOUT: ${{ inputs.publish-timeout }}
        PUBLISH_INTERVAL: ${{ inputs.publish-interval }}
      run: |
        set -euo pipefail

        node <<'NODE'
        const { execFileSync } = require('node:child_process');

        const filter = process.env.DEPENDENCY_FILTER;
        const timeout = Number(process.env.PUBLISH_TIMEOUT);
        const interval = Number(process.env.PUBLISH_INTERVAL);

        if (!Number.isFinite(timeout) || timeout <= 0 ||
            !Number.isFinite(interval) || interval <= 0) {
          throw new Error('publish-timeout and publish-interval must be positive numbers');
        }

        const output = execFileSync(
          'pnpm',
          ['--filter', filter, 'list', '--depth', '-1', '--json'],
          { encoding: 'utf8' }
        );

        const packages = JSON.parse(output);

        if (!Array.isArray(packages) || packages.length === 0) {
          throw new Error(`No packages matched dependency-filter: ${filter}`);
        }

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function waitForPackage(name, version) {
          const spec = `${name}@${version}`;
          const start = Date.now();

          console.log(`Waiting for ${spec} on npm...`);

          while (Date.now() - start < timeout * 1000) {
            try {
              const published = execFileSync(
                'npm',
                ['view', spec, 'version', '--json'],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
              ).trim();

              if (published) {
                console.log(`Available on npm: ${spec}`);
                return;
              }
            } catch {
              // The exact version is not visible yet.
            }

            console.log(`${spec} is not available yet. Retrying in ${interval}s...`);
            await sleep(interval * 1000);
          }

          throw new Error(`Timed out waiting for ${spec} after ${timeout}s`);
        }

        (async () => {
          for (const pkg of packages) {
            if (!pkg.name || !pkg.version) {
              throw new Error(`Could not determine package name/version: ${JSON.stringify(pkg)}`);
            }

            await waitForPackage(pkg.name, pkg.version);
          }
        })().catch(error => {
          console.error(error);
          process.exitCode = 1;
        });
        NODE

    - name: Prepare templates
      id: sync_prepare
      if: ${{ inputs.sync-templates == 'true' }}
      shell: bash
      env:
        TEMPLATE_PATTERNS: ${{ inputs.template-patterns }}
      run: node "$GITHUB_ACTION_PATH/scripts/template-sync.mjs" prepare

    - name: Preview packages
      shell: bash
      working-directory: ${{ inputs.packages-dir }}
      env:
        MODE: ${{ inputs.template-sync-mode }}
        DEPENDENCY_FILTER: ${{ inputs.dependency-filter }}
      run: |
        set -euo pipefail

        if [[ "$MODE" == "wait" && -n "$DEPENDENCY_FILTER" ]]; then
          pnpm -r --filter "!$DEPENDENCY_FILTER" publish --dry-run --no-git-checks
        else
          pnpm publish -r --dry-run --no-git-checks
        fi

    - name: Publish packages to npm
      if: ${{ inputs.dry-run-only != 'true' }}
      shell: bash
      working-directory: ${{ inputs.packages-dir }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
        NPM_ACCESS: ${{ inputs.access }}
        MODE: ${{ inputs.template-sync-mode }}
        DEPENDENCY_FILTER: ${{ inputs.dependency-filter }}
      run: |
        set -euo pipefail

        ARGS=(-r --tag "$NPM_DIST_TAG" --no-git-checks)

        if [[ -n "$NPM_ACCESS" ]]; then
          ARGS+=(--access "$NPM_ACCESS")
        fi

        if [[ "$MODE" == "wait" && -n "$DEPENDENCY_FILTER" ]]; then
          pnpm --filter "!$DEPENDENCY_FILTER" publish "${ARGS[@]}"
        else
          pnpm publish "${ARGS[@]}"
        fi

    - name: Restore templates
      if: ${{ always() && inputs.sync-templates == 'true' && steps.sync_prepare.outcome == 'success' }}
      shell: bash
      env:
        TEMPLATE_PATTERNS: ${{ inputs.template-patterns }}
      run: node "$GITHUB_ACTION_PATH/scripts/template-sync.mjs" restore
